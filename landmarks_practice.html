<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPv4 Landmarks Practice</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--fg:#14213d;--mut:#5b6b80;--bd:#cbd5e1;--ac:#1d4ed8;--acfg:#fff;--ok:#0f7a4a;--okbg:#e2f5ec;--bad:#b3261e;--badbg:#fdeceb;--hl:#fde68a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1722;--card:#18233a;--fg:#e6edf7;--mut:#9fb0c6;--bd:#2c3b57;--ac:#6ea0ff;--acfg:#0b1220;--ok:#5fd39b;--okbg:#123326;--bad:#ff8d86;--badbg:#3a1a1a;--hl:#6b5a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1722;--card:#18233a;--fg:#e6edf7;--mut:#9fb0c6;--bd:#2c3b57;--ac:#6ea0ff;--acfg:#0b1220;--ok:#5fd39b;--okbg:#123326;--bad:#ff8d86;--badbg:#3a1a1a;--hl:#6b5a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg button{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:8px 12px;font:inherit;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:.9rem}
.score{margin-left:auto;color:var(--mut);font-size:.9rem;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.given{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:1.35rem;line-height:1.7;margin:0 0 6px;overflow-x:auto}
.given span{color:var(--mut);font-size:.85rem;font-family:system-ui,sans-serif;display:inline-block;min-width:4.2em}
.row{display:grid;grid-template-columns:1fr;gap:4px;margin-top:12px}
.row label{font-size:.9rem;color:var(--mut)}
input,select{width:100%;padding:10px;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);border:2px solid var(--bd);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.row.ok input,.row.ok select{border-color:var(--ok);background:var(--okbg)}
.row.bad input,.row.bad select{border-color:var(--bad);background:var(--badbg)}
.fix{color:var(--bad);font-size:.9rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns button{padding:10px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.btns .go{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
.msg{margin-top:14px;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.steps{margin-top:14px;padding:12px 14px 12px 32px;background:var(--bg);border-radius:8px;border:1px dashed var(--bd);font-size:.95rem}
.steps li{margin:4px 0}
.steps code,.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--hl);color:var(--fg);padding:0 4px;border-radius:4px}
.tip{color:var(--mut);font-size:.85rem;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>IPv4 landmarks practice</h1>
<p class="sub">Find the network, broadcast, first usable and last usable address for a random address and mask.</p>
<div class="bar">
  <div class="seg" role="group" aria-label="Practice mode">
    <button id="mLand" aria-pressed="true">Four landmarks</button>
    <button id="mSame" aria-pressed="false">Same network?</button>
  </div>
  <label class="chk" id="binWrap"><input type="checkbox" id="binOn" checked style="width:auto"> Include binary step</label>
  <div class="score" id="score">0 of 0 correct · streak 0</div>
</div>
<div class="card">
  <div id="given"></div>
  <div id="fields"></div>
  <div class="btns">
    <button class="go" id="check">Check answers</button>
    <button id="steps">Show worked steps</button>
    <button id="next">New question</button>
  </div>
  <div id="msg" class="msg" aria-live="polite"></div>
  <ol id="sol" class="steps" hidden></ol>
</div>
<p class="tip">Type addresses with dots and no spaces (192.168.1.0) and binary as 8 digits (01100000). Press Enter to check.</p>
</main>
<script>
const $=id=>document.getElementById(id), rnd=n=>Math.floor(Math.random()*n);
const octs=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255], toIP=n=>octs(n).join('.');
const fromO=a=>((a[0]<<24)|(a[1]<<16)|(a[2]<<8)|a[3])>>>0;
const bin=n=>n.toString(2).padStart(8,'0');
const maskOf=p=>(0xFFFFFFFF<<(32-p))>>>0;
const PREF=[24,25,25,26,26,26,27,27,27,28,28,29,30,20,22,16];
let mode='land',Q,checked=false,sc={a:0,c:0,s:0};

function genIP(){
  const r=Math.random();
  if(r<.4){const k=rnd(3);return k==0?[10,rnd(256),rnd(256),rnd(256)]:k==1?[172,16+rnd(16),rnd(256),rnd(256)]:[192,168,rnd(256),rnd(256)]}
  if(r<.6){const t=[[172,32+rnd(30)],[172,rnd(16)],[192,169],[11,rnd(256)],[169,254]][rnd(5)];return [...t,rnd(256),rnd(256)]}
  let a;do a=1+rnd(223);while([10,127,169,172,192].includes(a));return [a,rnd(256),rnd(256),rnd(256)];
}
function info(ip,p){const m=maskOf(p),net=(ip&m)>>>0,bc=(net|~m)>>>0;return{ip,p,m,net,bc,first:net+1,last:bc-1,oi:Math.floor(p/8)}}
function priv(a){
  if(a[0]==10)return[1,'it starts with 10 (10.0.0.0/8)'];
  if(a[0]==172&&a[1]>=16&&a[1]<=31)return[1,'172 with second octet '+a[1]+' is inside 172.16–172.31'];
  if(a[0]==192&&a[1]==168)return[1,'it starts with 192.168 (192.168.0.0/16)'];
  if(a[0]==172)return[0,'172 with second octet '+a[1]+' is outside 172.16–172.31'];
  return[0,'it isn’t in 10.x, 172.16–31.x or 192.168.x'];
}
function genQ(){
  const p=PREF[rnd(PREF.length)],a=genIP();
  let I=info(fromO(a),p);
  while(I.ip==I.net||I.ip==I.bc){a[3]=rnd(256);I=info(fromO(a),p)}
  if(mode=='same'){
    const size=2**(32-p);let ip2;
    if(Math.random()<.5)ip2=I.net+1+rnd(size-2);
    else{const k=(1+rnd(3))*(Math.random()<.5?1:-1);ip2=(I.net+k*size)>>>0;ip2=ip2-info(ip2,p).net+info(ip2,p).net+1+rnd(size-2)}
    I.ip2=ip2>>>0;I.n2=info(I.ip2,p).net;
  }
  return I;
}
function i2(a){return a[2]}

function andLines(I,ip,net){
  const oi=I.oi,io=octs(ip)[oi],mo=octs(I.m)[oi],no=octs(net)[oi];
  return [`Copy the octets where the mask is 255: <code>${octs(ip).slice(0,oi).join('.')}</code>`,
   `Octet ${oi+1} is the odd one: <code>${bin(io)}</code> AND <code>${bin(mo)}</code> = <code>${bin(no)}</code> = ${no}`,
   `Network address: <code>${toIP(net)}</code>`];
}
function fields(){
  const I=Q,oi=I.oi,o=n=>octs(n)[oi],f=[];
  if(mode=='same'){
    return [{id:'n1',l:`Network address of ${toIP(I.ip)}`,a:toIP(I.net)},
            {id:'n2',l:`Network address of ${toIP(I.ip2)}`,a:toIP(I.n2)},
            {id:'rel',l:'Do they need a router to reach each other?',a:I.net==I.n2?'Same network':'Different networks',sel:['','Same network','Different networks']}];
  }
  if($('binOn').checked)f.push(
    {id:'oa',l:`Octet ${oi+1} of the address in binary`,a:bin(o(I.ip))},
    {id:'om',l:`Octet ${oi+1} of the mask in binary`,a:bin(o(I.m))},
    {id:'oand',l:'AND result of that octet in binary',a:bin(o(I.net))});
  f.push({id:'net',l:'Network address',a:toIP(I.net)},{id:'bc',l:'Broadcast address',a:toIP(I.bc)},
    {id:'first',l:'First usable address',a:toIP(I.first)},{id:'last',l:'Last usable address',a:toIP(I.last)},
    {id:'pp',l:'Private or public?',a:priv(octs(I.ip))[0]?'Private':'Public',sel:['','Private','Public']});
  return f;
}
function render(){
  checked=false;$('msg').textContent='';$('msg').className='msg';$('sol').hidden=true;
  const m=toIP(Q.m);
  $('given').innerHTML=mode=='land'
   ?`<p class="given"><span>Address</span>${toIP(Q.ip)}</p><p class="given"><span>Mask</span>${m}</p>`
   :`<p class="given"><span>Host A</span>${toIP(Q.ip)}</p><p class="given"><span>Host B</span>${toIP(Q.ip2)}</p><p class="given"><span>Mask</span>${m}</p>`;
  $('fields').innerHTML=fields().map(f=>`<div class="row" id="r_${f.id}"><label for="${f.id}">${f.l}</label>`+
    (f.sel?`<select id="${f.id}">${f.sel.map(s=>`<option>${s}</option>`).join('')}</select>`:`<input id="${f.id}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${/^o/.test(f.id)?'numeric':'decimal'}">`)+
    `<div class="fix" id="x_${f.id}"></div></div>`).join('');
  const first=document.querySelector('#fields input');if(first)first.focus();
  upScore();
}
function upScore(){$('score').textContent=`${sc.c} of ${sc.a} correct · streak ${sc.s}`}
function check(){
  let all=true;
  fields().forEach(f=>{
    const v=$(f.id).value.replace(/\s/g,''),ok=v===f.a;all=all&&ok;
    $('r_'+f.id).className='row '+(ok?'ok':'bad');
    $('x_'+f.id).textContent=ok?'':`Answer: ${f.a}`;
  });
  if(!checked){checked=true;sc.a++;if(all){sc.c++;sc.s++}else sc.s=0;upScore()}
  $('msg').className='msg '+(all?'ok':'bad');
  $('msg').textContent=all?'All correct. Press New question for another.':'Some answers need work. Compare with the answers shown, or open the worked steps.';
}
function solve(){
  const I=Q,oi=I.oi,bco=octs(I.bc)[oi],pr=priv(octs(I.ip));let L;
  if(mode=='same'){
    const J={...I};
    L=[`<b>Host A:</b>`,...andLines(I,I.ip,I.net),`<b>Host B:</b>`,...andLines(I,I.ip2,I.n2),
       I.net==I.n2?`The network addresses match, so the hosts are on the <b>same network</b>. No router needed.`:`The network addresses are different, so the hosts are on <b>different networks</b>. A router is needed.`];
  }else{
    L=[...andLines(I,I.ip,I.net),
     `Broadcast: set the host bits (under the mask’s 0s) to 1. Octet ${oi+1} becomes <code>${bin(bco)}</code> = ${bco}, and every octet after it is 255: <code>${toIP(I.bc)}</code>`,
     `First usable = network + 1 = <code>${toIP(I.first)}</code>`,
     `Last usable = broadcast − 1 = <code>${toIP(I.last)}</code>`,
     `${pr[0]?'Private':'Public'}: ${pr[1]}.`];
  }
  return L;
}
function setMode(m){mode=m;$('mLand').setAttribute('aria-pressed',m=='land');$('mSame').setAttribute('aria-pressed',m=='same');$('binWrap').style.display=m=='land'?'flex':'none';next()}
function next(){Q=genQ();render()}
$('check').onclick=check;$('next').onclick=next;
$('steps').onclick=()=>{const s=$('sol');if(s.hidden){s.innerHTML=solve().map(x=>`<li>${x}</li>`).join('');s.hidden=false}else s.hidden=true};
$('mLand').onclick=()=>setMode('land');$('mSame').onclick=()=>setMode('same');
$('binOn').onchange=render;
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();check()}});
next();
</script>
</body>
</html>
